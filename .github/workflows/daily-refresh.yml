# Every day: pull new diary entries from my Letterboxd RSS feed, fetch TMDB details for any new films,
# and commit the updated data. Vercel redeploys automatically when this pushes.
# Needs a repository secret named TMDB_API_KEY (GitHub repo -> Settings -> Secrets and variables -> Actions).
name: Daily refresh

on:
  schedule:
    - cron: "17 10 * * *" # 10:17 UTC = early morning in Toronto
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv

      - name: New diary entries from RSS
        run: python pipeline/fetch_rss.py
        env:
          LETTERBOXD_USER: eglantinee

      - name: TMDB details for new films
        run: python pipeline/enrich_tmdb.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Copy data into the website
        run: node web/scripts/sync-data.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed web/src/data
          git diff --cached --quiet || (git commit -m "Daily data refresh" && git push)
